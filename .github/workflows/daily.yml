name: Daily Update

on:
  schedule:
    - cron: "0 5 * * *"      # täglich um 05:00 UTC
  workflow_dispatch:          # erlaubt manuelles Starten per Button

permissions:
  contents: write             # nötig, damit der Job die JSON committen darf

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run update script
        run: python update.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          ALLY_ID: ${{ secrets.ALLY_ID }}

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/members.json
          git diff --cached --quiet || git commit -m "Daily update"
          git push
