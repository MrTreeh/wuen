name: Kutscher-Update

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Update ausfuehren
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ALLY_ID: ${{ secrets.ALLY_ID }}
        run: python update.py
      - name: Aenderungen committen
        run: |
          git config user.name "kutscher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json members.json
          git diff --cached --quiet || git commit -m "Kutscher-Update $(date +%F)"
          git push
