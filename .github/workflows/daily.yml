name: Kutscher-Update

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Testmodus: Auswahl auch mehrfach pro Tag ausfuehren"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Update ausfuehren
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ALLY_ID: ${{ secrets.ALLY_ID }}
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
        run: python update.py
      - name: Commit & Push
        run: |
          git config user.name "kutscher-bot"
          git config user.email "kutscher-bot@users.noreply.github.com"
          git add docs/members.json docs/data.json
          git diff --staged --quiet || git commit -m "Kutscher-Update $(date +%F)"
          git pull --rebase
          git push
