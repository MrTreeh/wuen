<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kutscher-Board</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel2: #1c232d;
    --line: #2a3340;
    --text: #e6edf3;
    --muted: #8b98a8;
    --accent: #e0a030;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  .eyebrow { color: var(--accent); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: 4px 0 8px; font-size: 2.2rem; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }
  .driver { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .driver .name { font-size: 1.9rem; font-weight: 700; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    background: var(--panel2); border: 1px solid var(--line);
    color: var(--accent); font-size: .85rem;
  }
  .driver-info { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .day-badge {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    font-size: .85rem; font-weight: 600; color: #0e1116;
    background: var(--day, #8b98a8);
  }
  /* Farbe je Wochentag */
  .day-mon { --day: #4cc9f0; }   /* Montag   - Hellblau */
  .day-tue { --day: #f72585; }   /* Dienstag - Pink */
  .day-wed { --day: #7bd389; }   /* Mittwoch - Gruen */
  .day-thu { --day: #ffb703; }   /* Donnerstag - Gelb */
  .day-fri { --day: #9d4edd; }   /* Freitag  - Lila */
  .day-sat { --day: #ff6b35; }   /* Samstag  - Orange */
  .day-sun { --day: #e63946; }   /* Sonntag  - Rot */
  .hint { color: var(--muted); font-size: .9rem; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab {
    background: var(--panel2); color: var(--muted); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: .95rem;
  }
  .tab.active { color: var(--text); border-color: var(--accent); }
  .hidden { display: none; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.first td { color: var(--accent); font-weight: 600; }
  footer { color: var(--muted); font-size: .85rem; text-align: center; margin-top: 24px; }
  .avatar {
    border-radius: 50%; object-fit: cover; background: var(--panel2);
    border: 2px solid var(--line); flex: none;
  }
  .avatar.big { width: 84px; height: 84px; border-color: var(--accent); }
  .avatar.small { width: 32px; height: 32px; }
  .who { display: flex; align-items: center; gap: 12px; }
  .namecell { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Kutscher-Board</div>
  <h1>Heutiger Fahrer</h1>

  <div class="card">
    <div class="driver">
      <img id="driver-avatar" class="avatar big" alt="" referrerpolicy="no-referrer">
      <div class="driver-info">
        <div class="name" id="driver-name">–</div>
        <span class="badge" id="driver-rank">–</span>
        <span class="day-badge" id="date">Lade ...</span>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="prev">Kutscher-Vorschau</button>
    <button class="tab" data-tab="cand">Statistik</button>
  </div>

  <div class="card hidden" id="cand">
    <table>
      <thead><tr><th>#</th><th>Name</th><th>Rang</th><th class="num">Counter</th><th>Zuletzt gefahren</th></tr></thead>
      <tbody id="cand-body"></tbody>
    </table>
  </div>

  <div class="card" id="prev">
    <table>
      <thead><tr><th>Datum</th><th>Tag</th><th>Ränge</th><th>Fahrer</th></tr></thead>
      <tbody id="prev-body"></tbody>
    </table>
  </div>

  <footer id="updated"></footer>
</div>

<script>
const esc = s => String(s ?? "").replace(/[\u0026\u003c\u003e\u0022]/g, c => "&#" + c.charCodeAt(0) + ";");

const avatar = (url, cls) =>
  url ? `<img class="avatar ${cls}" src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`
      : `<span class="avatar ${cls}"></span>`;
  
fetch("data.json?_=" + Date.now())
  .then(r => {
    if (!r.ok) throw new Error("data.json: HTTP " + r.status);
    return r.json();
  })
  .then(d => {
    const da = document.getElementById("driver-avatar");
    if (d.driver.avatar_url) da.src = d.driver.avatar_url; else da.style.visibility = "hidden";
    const dayClasses = {
      Montag: "day-mon", Dienstag: "day-tue", Mittwoch: "day-wed",
      Donnerstag: "day-thu", Freitag: "day-fri", Samstag: "day-sat", Sonntag: "day-sun"
    };
    const dateEl = document.getElementById("date");
    dateEl.textContent = d.weekday + ", " + d.date;
    dateEl.classList.add(dayClasses[d.weekday] || "");
    document.getElementById("driver-name").textContent = d.driver.nick_name;
    document.getElementById("driver-rank").textContent = d.driver.rank_label;

    document.getElementById("cand-body").innerHTML = d.candidates.map((m, i) =>
      `<tr class="${i === 0 ? "first" : ""}">
         <td>${i + 1}</td><td><div class="namecell">${avatar(m.avatar_url, "small")}${esc(m.nick_name)}</div></td><td>${esc(m.rank_label)}</td>
         <td class="num">${m.counter}</td><td>${esc(m.last_driven || "–")}</td>
       </tr>`).join("");

    document.getElementById("prev-body").innerHTML = d.preview.map(p =>
      `<tr><td>${esc(p.date)}</td><td>${esc(p.weekday)}</td>
       <td>R${p.allowed_ranks.join(", R")}</td>
       <td>${p.driver ? `<div class="namecell">${avatar(p.driver.avatar_url, "small")}${esc(p.driver.nick_name)}</div>` : "–"}</td></tr>`).join("");

    document.getElementById("updated").textContent = "Stand: " + d.updated_at;
  })
  .catch(err => {
    console.error(err);
    document.getElementById("date").textContent = "Fehler: " + err.message;
  });

document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
  document.getElementById("cand").classList.toggle("hidden", btn.dataset.tab !== "cand");
  document.getElementById("prev").classList.toggle("hidden", btn.dataset.tab !== "prev");
}));
</script>
</body>
</html>
