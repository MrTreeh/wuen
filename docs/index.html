<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kutscher-Auswahl</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  .today { background: #eef6ff; border: 2px solid #3b82f6; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
  .today .name { font-size: 1.6rem; font-weight: 700; }
  .today .meta { color: #555; margin-top: .25rem; }
  .warn { background: #fff4e5; border: 1px solid #f59e0b; padding: .5rem .75rem; border-radius: 8px; margin-top: .75rem; font-size: .9rem; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #ddd; }
  th { font-size: .85rem; color: #666; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.is-today td { background: #eef6ff; font-weight: 600; }
  .small { color: #777; font-size: .85rem; }
</style>
</head>
<body>
<h1>Wer fährt heute?</h1>
<div id="today" class="today">Lade …</div>

<h2>Voraussichtlich die nächsten 6 Tage</h2>
<table id="preview">
  <thead><tr><th>Tag</th><th>Name</th><th>Rang</th><th class="num">Power</th></tr></thead>
  <tbody></tbody>
</table>

<h2>Statistik</h2>
<table id="stats">
  <thead><tr><th>Name</th><th>Rang</th><th class="num">Fahrten</th><th>Zuletzt</th></tr></thead>
  <tbody></tbody>
</table>

<p class="small" id="updated"></p>

<script>
const WD_DE = {
  Monday: "Montag", Tuesday: "Dienstag", Wednesday: "Mittwoch",
  Thursday: "Donnerstag", Friday: "Freitag", Saturday: "Samstag", Sunday: "Sonntag"
};

function esc(s) {
  return String(s ?? "")
    .split("\u0026").join("\u0026amp;")
    .split("\u003c").join("\u0026lt;")
    .split("\u003e").join("\u0026gt;")
    .split("\u0022").join("\u0026quot;")
    .split("\u0027").join("\u0026#39;");
}

function fmtDate(iso) {
  if (!iso) return "noch nie";
  const [y, m, d] = iso.split("-");
  return `${d}.${m}.${y}`;
}

function fmtPower(p) {
  return (p === undefined || p === null || p === "") ? "–" : Number(p).toLocaleString("de-DE");
}

fetch("data.json?_=" + Date.now())
  .then(r => r.json())
  .then(d => {
    const dr = d.driver;

    // Heutiger Kutscher
    let html = "";
    if (dr) {
      html += `<div class="name">${esc(dr.nick_name)}</div>`;
      html += `<div class="meta">${esc(dr.rank_label)} · ${WD_DE[d.weekday] || esc(d.weekday)}, ${fmtDate(d.date)}</div>`;
      html += `<div class="meta">Fahrberechtigt heute: ${(d.allowed_ranks || []).map(r => "R" + r).join(", ")}</div>`;
    } else {
      html = "Kein Kutscher gefunden.";
    }
    if (d.fallback) {
      html += `<div class="warn">${esc(d.fallback)}</div>`;
    }
    document.getElementById("today").innerHTML = html;

    // Vorschau
    const pb = document.querySelector("#preview tbody");
    pb.innerHTML = "";
    (d.preview || []).forEach(p => {
      const m = p.driver;
      pb.insertAdjacentHTML("beforeend",
        `<tr>
          <td>${WD_DE[p.weekday] || esc(p.weekday)}, ${fmtDate(p.date)}</td>
          <td>${m ? esc(m.nick_name) : "–"}</td>
          <td>${m ? esc(m.rank_label) : ""}</td>
          <td class="num">${m ? fmtPower(m.power) : ""}</td>
        </tr>`);
    });

    // Statistik: niedrigster Counter zuerst, dann am längsten nicht gefahren
    const sorted = [...(d.candidates || [])].sort((a, b) =>
      a.counter - b.counter ||
      (a.last_driven || "").localeCompare(b.last_driven || "") ||
      a.nick_name.localeCompare(b.nick_name)
    );

    const sb = document.querySelector("#stats tbody");
    sb.innerHTML = "";
    sorted.forEach(s => {
      const isToday = dr && s.uid === dr.uid;
      sb.insertAdjacentHTML("beforeend",
        `<tr${isToday ? ' class="is-today"' : ""}>
          <td>${esc(s.nick_name)}</td>
          <td>${esc(s.rank_label)}</td>
          <td class="num">${s.counter}</td>
          <td>${fmtDate(s.last_driven)}</td>
        </tr>`);
    });

    document.getElementById("updated").textContent =
      "Stand: " + String(d.updated_at || "").replace("T", " ").slice(0, 16);
  })
  .catch(err => {
    console.error("Ladefehler:", err);
    document.getElementById("today").textContent = "data.json konnte nicht geladen werden.";
  });
</script>
</body>
</html>
