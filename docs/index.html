<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allianz-Mitglieder</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #f5f5f5; }
    h1 { margin-bottom: 1rem; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #333; color: #fff; cursor: pointer; }
    tr:hover td { background: #f0f7ff; }
    img { width: 32px; height: 32px; border-radius: 50%; vertical-align: middle; }
    .online { color: green; font-weight: bold; }
    .offline { color: #999; }
  </style>
</head>
<body>
  <h1>Allianz-Mitglieder</h1>
  <p id="info">Lade Daten …</p>
  <table id="tabelle" hidden>
    <thead>
      <tr>
        <th></th>
        <th>Name</th>
        <th>Rang</th>
        <th>Power</th>
        <th>Online</th>
        <th>Zuletzt online</th>
        <th>Beigetreten</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    function fmt(datum) {
      if (!datum) return "-";
      const d = new Date(datum);
      return isNaN(d) ? datum : d.toLocaleString("de-DE");
    }

    fetch("members.json")
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(members => {
        const body = document.querySelector("#tabelle tbody");
        members.sort((a, b) => (b.power || 0) - (a.power || 0));

        for (const m of members) {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${m.avatar_url ? `<img src="${m.avatar_url}" alt="">` : ""}</td>
            <td>${m.nick_name ?? "-"}</td>
            <td>${m.rank_label ?? "-"}</td>
            <td>${(m.power ?? 0).toLocaleString("de-DE")}</td>
            <td class="${m.online ? "online" : "offline"}">${m.online ? "online" : "offline"}</td>
            <td>${fmt(m.last_online_at)}</td>
            <td>${fmt(m.joined_at)}</td>`;
          body.appendChild(tr);
        }

        document.getElementById("info").textContent = members.length + " Mitglieder";
        document.getElementById("tabelle").hidden = false;
      })
      .catch(err => {
        document.getElementById("info").textContent = "Fehler beim Laden: " + err.message;
      });
  </script>
</body>
</html>
