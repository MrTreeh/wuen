<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allianz-Übersicht</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .5rem; border-bottom: 1px solid #ddd; text-align: left; }
    th:last-child, td:last-child { text-align: right; }
    small { color: #777; }
  </style>
</head>
<body>
  <h1>Allianz-Übersicht</h1>
  <small id="updated"></small>
  <table>
    <thead><tr><th>Name</th><th>Counter</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    fetch("members.json")
      .then(r => r.json())
      .then(data => {
        document.getElementById("updated").textContent = "Stand: " + data.updated;
        const members = Object.entries(data.members)
          .map(([id, m]) => ({ id, ...m }))
          .sort((a, b) => b.counter - a.counter);
        document.getElementById("rows").innerHTML = members
          .map(m => `<tr><td>${m.name}</td><td>${m.counter}</td></tr>`)
          .join("");
      });
  </script>
</body>
</html>
